services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: ridemate-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Set DATABASE_URL to your Supabase connection string (see DEPLOYMENT.md)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "True"
      - key: COOKIE_SAMESITE
        value: "none"
      # Update these after your Vercel frontend is deployed
      - key: FRONTEND_URL
        value: https://rideshare.vercel.app
      - key: CORS_ORIGINS
        value: '["https://rideshare.vercel.app"]'

  # ── Frontend (React/Vite static site) ─────────────────────────────────────
  # NOTE: We recommend deploying frontend to Vercel instead (faster CDN).
  # This entry is kept as fallback only.
  - type: web
    name: ridemate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ridemate-api.onrender.com/api/v1
