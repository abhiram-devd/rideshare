services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: ridemate-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ridemate-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "True"
      - key: COOKIE_SAMESITE
        value: "none"
      # Set this AFTER your Vercel frontend is deployed
      - key: FRONTEND_URL
        value: https://your-vercel-app.vercel.app
      - key: CORS_ORIGINS
        value: '["https://your-vercel-app.vercel.app"]'

  # ── Frontend (React/Vite) ──────────────────────────────────────────────────
  - type: web
    name: ridemate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your Render backend URL after first backend deploy
      - key: VITE_API_URL
        value: https://ridemate-api.onrender.com/api/v1

# ── Database (PostgreSQL via Supabase — add manually in dashboard) ──────────
# Render's free DB expires after 90 days.
# Instead, connect a Supabase DB:
#   1. Create a project at https://supabase.com
#   2. Copy the connection string from Project Settings > Database
#   3. Set DATABASE_URL in the ridemate-api service env vars above
#
# If you prefer Render's built-in DB (ok for testing):
databases:
  - name: ridemate-db
    databaseName: ridemate
    plan: free
